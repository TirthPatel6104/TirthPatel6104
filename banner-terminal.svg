<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 220" width="1000" height="220" role="img" aria-label="Tirth Patel — software engineer, AI systems and backend">
  <defs>
    <style>
      .m{font:500 18px ui-monospace,"SF Mono",Menlo,Consolas,monospace;fill:#c9d1d9}
      .n{font:700 44px ui-monospace,"SF Mono",Menlo,Consolas,monospace;fill:#f3f0ff}
      .p{fill:#1ee6ff}.k{fill:#7d7891}.g{fill:#39ff9c}
    </style>
    <!-- typewriter reveals -->
    <clipPath id="c1"><rect x="0" y="40" height="60" width="0"><animate attributeName="width" from="0" to="420" dur="1.1s" begin="0.4s" fill="freeze" calcMode="discrete" values="0;40;80;120;160;200;240;280;320;360;420"/></rect></clipPath>
    <clipPath id="c2"><rect x="0" y="110" height="36" width="0"><animate attributeName="width" from="0" to="620" dur="1.4s" begin="1.8s" fill="freeze" calcMode="discrete" values="0;60;120;180;240;300;360;420;480;540;620"/></rect></clipPath>
    <clipPath id="c3"><rect x="0" y="146" height="36" width="0"><animate attributeName="width" from="0" to="720" dur="1.4s" begin="3.4s" fill="freeze" calcMode="discrete" values="0;72;144;216;288;360;432;504;576;648;720"/></rect></clipPath>
  </defs>

  <rect width="1000" height="220" rx="8" fill="#0d1117"/>
  <rect x=".5" y=".5" width="999" height="219" rx="8" fill="none" stroke="#30363d"/>

  <!-- title bar -->
  <rect x="1" y="1" width="998" height="30" rx="8" fill="#161b22"/>
  <rect x="1" y="20" width="998" height="11" fill="#161b22"/>
  <circle cx="22" cy="16" r="5" fill="#ff5f57"/><circle cx="40" cy="16" r="5" fill="#febc2e"/><circle cx="58" cy="16" r="5" fill="#28c840"/>
  <text class="m k" x="500" y="21" text-anchor="middle" font-size="12">tirth@github — ~</text>

  <!-- line 1: name -->
  <text class="m p" x="28" y="80">$</text>
  <g clip-path="url(#c1)"><text class="n" x="48" y="84">tirth_patel</text></g>

  <!-- line 2 -->
  <text class="m p" x="28" y="134">$</text>
  <g clip-path="url(#c2)"><text class="m" x="48" y="134"><tspan class="k">role</tspan>  software engineer · ai systems &amp; backend</text></g>

  <!-- line 3 -->
  <text class="m p" x="28" y="170">$</text>
  <g clip-path="url(#c3)"><text class="m" x="48" y="170"><tspan class="k">stack</tspan> python · typescript · fastapi · sql · mcp</text></g>

  <!-- cursor -->
  <rect x="48" y="186" width="11" height="20" fill="#1ee6ff">
    <animate attributeName="opacity" values="1;0;1" dur="1s" repeatCount="indefinite" begin="4.9s"/>
    <set attributeName="opacity" to="0" begin="0s" end="4.9s"/>
  </rect>
  <text class="m g" x="920" y="204" text-anchor="end" font-size="13">● toronto · open to work</text>
</svg>
